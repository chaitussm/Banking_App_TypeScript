name: Playwright E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 12:00 AM IST = 6:30 PM UTC
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      BASE_URL: http://localhost:5174
      API_URL: http://localhost:4000
      BANK_CUSTOMER_EMAIL: ava.smith@novabank.com
      BANK_CUSTOMER_PASSWORD: ava@123
      BANK_MANAGER_EMAIL: mia.johnson@novabank.com
      BANK_MANAGER_PASSWORD: mia@123
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: nohup node src/server.js > /tmp/backend.log 2>&1 &

      - name: Start frontend with API proxy
        run: nohup node scripts/serve-frontend.js > /tmp/frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:4000/health
          npx wait-on http://localhost:5174/login

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            playwright-report.json
          if-no-files-found: ignore

      - name: Generate HTML email report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/generate_email_report.py

      - name: Send email with HTML report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Playwright E2E Tests - ${{ job.status }} | ${{ github.sha }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: file://email-report.html
